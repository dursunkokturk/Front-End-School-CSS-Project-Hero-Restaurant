<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Restaurant</title>
  <link rel="stylesheet" href="assets/css/hero-restaurant.css">
</head>

<body>
  <div class="container">
    <h1>Biggy <br> Burger</h1>
    <p class="burger-text">Bolca peynir katmanı, karamelize soğan, <br> taptaze sebzeler ve nefis mayonezle <br> dolu!
    </p>

    <div class="amount-section">
      <img src="assets/img/plus-icon.png" alt="plus icon">

      <h3>12.50₺</h3>
    </div>

    <div class="delivery-section">
      <img src="assets/img/truck-icon.png" alt="Delivery Icon">
      <p>Tahmini teslimat <br> <strong>15 Dakika</strong></p>
    </div>
  </div>
</body>

</html>
